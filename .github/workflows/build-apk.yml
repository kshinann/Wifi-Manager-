name: Build debug APKs

on:
  workflow_dispatch:
  push:
    branches:
      - claude/video-download-app-yu5tlt
    paths:
      - .github/workflows/build-apk.yml
      - mobile/**

jobs:
  native-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: mobile/native-app
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: native-app-debug-apk
          path: mobile/native-app/app/build/outputs/apk/debug/app-debug.apk

  webview-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor deps
        working-directory: mobile/webview-app
        run: npm install

      - name: Sync Android platform
        working-directory: mobile/webview-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/webview-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: webview-app-debug-apk
          path: mobile/webview-app/android/app/build/outputs/apk/debug/app-debug.apk
