name: Android APK

on:
  push:
    branches: [ccr-96fd3e25-3fxd0c, main]
    paths:
      - 'cube-away-game/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cube-away-game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Puzzle logic tests
        run: npm test

      - name: Check JavaScript bundle
        run: npx expo export --platform android --output-dir dist-check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: cube-away-game/android
        # The Expo template signs release builds with the debug key: installable, not Play Store ready.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: cube-quest-apk
          path: cube-away-game/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
