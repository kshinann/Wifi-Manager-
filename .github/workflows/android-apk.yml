name: Android test APK

on:
  push:
    branches: [main, ccr-66c8814d-t40nh6]
    paths:
      - 'android/**'
      - 'mockup/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VariaConnect-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Varia Connect test build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Test build of the Varia Connect mockup app (sample data only).
            Install on Android 8.0 or newer: download the .apk on the phone, open it and allow "Install unknown apps" when asked.
            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/*.apk
