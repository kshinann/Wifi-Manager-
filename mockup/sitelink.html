<title>SiteLink Construction Suite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: site-office app shell — signage-style condensed headers, concrete neutrals, engineering blue for action, hi-vis amber only for safety calls to action */
:root{
  --bg:#ECEFF0; --surface:#FFFFFF; --surface-2:#F4F6F7; --fg:#1B2328; --muted:#5B676F; --line:#D3D9DC;
  --primary:#1F4E79; --primary-soft:#E3ECF5; --on-primary:#FFFFFF;
  --hivis:#F2A900; --on-hivis:#1B1A12;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --warn:#9A6312; --warn-soft:#FBF0DA; --bad:#B53328; --bad-soft:#F8E3E0;
  --plan:#8A979E;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161A; --surface:#192025; --surface-2:#1F282E; --fg:#E4E9EB; --muted:#97A3AA; --line:#2C373D;
  --primary:#7BAEDD; --primary-soft:#1D3347; --on-primary:#0E1A25;
  --hivis:#F5B82E; --on-hivis:#1B1A12;
  --ok:#62C48B; --ok-soft:#173326; --warn:#E3AA52; --warn-soft:#3A2C14; --bad:#EE7B70; --bad-soft:#3D1D1A;
  --plan:#6E7B82; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161A; --surface:#192025; --surface-2:#1F282E; --fg:#E4E9EB; --muted:#97A3AA; --line:#2C373D;
  --primary:#7BAEDD; --primary-soft:#1D3347; --on-primary:#0E1A25;
  --hivis:#F5B82E; --on-hivis:#1B1A12;
  --ok:#62C48B; --ok-soft:#173326; --warn:#E3AA52; --warn-soft:#3A2C14; --bad:#EE7B70; --bad-soft:#3D1D1A;
  --plan:#6E7B82; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand svg{width:26px;height:26px}
.proj{display:flex;flex-direction:column;gap:2px;line-height:1.2;min-width:0;padding-left:12px;border-left:1px solid var(--line)}
.proj span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.proj select{font-weight:600;max-width:280px}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--ok-soft);color:var(--ok);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.off{background:var(--warn-soft);color:var(--warn)}
.offline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.offline b{color:var(--fg)}
nav.side .ls{display:none}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hv{background:var(--hivis);color:var(--on-hivis);border-color:var(--hivis);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:default}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 60px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--fg)}
nav.side button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
nav.side .badge{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:0 7px}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:30px;font-weight:700;text-transform:uppercase}
h2{font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:17px;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--muted)}
.demo b{color:var(--fg)}
.link{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
@media (max-width:720px){.g2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel > .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12px}
.kpi.alert{border-left:4px solid var(--bad)}
.kpi.caution{border-left:4px solid var(--hivis)}
.up{color:var(--ok)} .down{color:var(--bad)}

.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.sec td{background:var(--surface-2);font-weight:600;font-family:var(--f-display);font-size:15px;letter-spacing:.03em;text-transform:uppercase}
tfoot td{font-weight:600;border-bottom:0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:20px;padding:1px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
td.tag{white-space:nowrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--primary)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line);min-width:60px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--hivis)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:600}
.li .t p{margin:2px 0 0;color:var(--muted);font-size:13px}
.when{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--hivis)} .sev.ok{background:var(--ok)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}

.hero-cta{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--hivis);color:var(--on-hivis);border-radius:var(--r);padding:20px}
.hero-cta h2{font-size:26px}
.hero-cta .btn{background:var(--on-hivis);color:var(--hivis);border-color:var(--on-hivis)}
.checkin{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}

.feat{display:flex;flex-direction:column;gap:8px}
.feat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.feat li{font-size:13.5px}
.feat .phase{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:4px}

/* modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,17,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;font-size:14px;color:var(--fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:13px;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:30;font-size:13.5px;max-width:calc(100% - 32px)}

@media (max-width:860px){
  /* phone: bottom tab bar, thumb-sized targets */
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;left:0;right:0;bottom:0;z-index:6;flex-direction:row;overflow-x:auto;gap:2px;border-right:0;border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.side .grp{display:none}
  nav.side button{position:relative;flex:1 0 64px;width:auto;flex-direction:column;justify-content:center;gap:3px;padding:6px 4px;font-size:11px;min-height:52px}
  nav.side button svg{width:22px;height:22px}
  nav.side .lf{display:none} nav.side .ls{display:inline}
  nav.side .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;padding:0 5px;font-size:10px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .top{position:static}
  .proj{border-left:0;padding-left:0;flex:1 1 160px}
  .proj select{max-width:100%;width:100%}
  .brand{font-size:19px}
  .ctl-l{display:none}
  .btn,.chip{min-height:40px}
  .btn.sm{min-height:34px}
  h1{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){.panel,.kpi{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

  <div class="brand" aria-label="SiteLink">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="var(--hivis)"/><path d="M6 19 13 6l7 13" stroke="var(--on-hivis)" stroke-width="2.4" fill="none" stroke-linejoin="round"/><path d="M9 14h8" stroke="var(--on-hivis)" stroke-width="2.4"/></svg>
    SiteLink

  <label class="proj" for="proj"><span>Project</span>

  <label class="ctl" for="role"><span class="ctl-l">Viewing as</span>
    <select id="role">
      <option value="office">Head office / Client</option>
      <option value="manager" selected>Site manager</option>
      <option value="worker">Worker / Subcon</option>
      <option value="it">Site IT admin</option>

  </label>
  <button class="btn hv" id="reportBtn" type="button">＋ Report hazard</button>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Modules"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>

const pill = (txt) => {

  const cls = Object.keys(map).find(k=>map[k].includes(txt))||'';

};

function sCurve(){
  const plan=[0,2,5,9,14,20,27,35,43,51,59,66,72,78,84,89,93,96,98,100];
  const act =[0,1.5,4,8,13,18,24,31,38,46,53,59.5,64.2];
  const W=560,H=220,L=36,R=12,T=12,B=26, n=plan.length-1;
  const x=i=>L+(W-L-R)*i/n, y=v=>T+(H-T-B)*(1-v/100);
  const line=a=>a.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let g=''; [0,25,50,75,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}%</text>`;});
  const months=['Apr 25','Oct 25','Apr 26','Oct 26','Apr 27','Nov 27'];
  [0,6,12,18].forEach((i,k)=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${months[k*1]}</text>`;});
  g+=`<text x="${x(n)}" y="${H-8}" text-anchor="end">Nov 27</text>`;
  const li=act.length-1;
  const area=`${L},${y(0)} ${line(act)} ${x(li)},${y(0)}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="S-curve: planned 72% versus actual 64.2% at month 12">${g}
    <polygon points="${area}" fill="var(--primary)" opacity=".1"/>
    <polyline points="${line(plan)}" fill="none" stroke="var(--plan)" stroke-width="2" stroke-dasharray="5 4"/>
    <polyline points="${line(act)}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>
    <line x1="${x(li)}" x2="${x(li)}" y1="${T}" y2="${H-B}" stroke="var(--hivis)" stroke-width="1.5"/>
    <circle cx="${x(li)}" cy="${y(act[li])}" r="4.5" fill="var(--primary)"/>
    <text x="${x(li)+7}" y="${y(act[li])+14}" style="fill:var(--fg)">64.2%</text>
    <text x="${x(12)+7}" y="${y(plan[12])-6}">plan 72%</text>
  </svg>`;
}

}

      ${S.online?'':'<p class="offline" style="margin:0">No signal. This report will be saved on your phone and sent automatically.</p>'}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="button" data-close>Cancel</button><button class="btn hv" type="submit">Submit report</button></div>
    </form>`);
}
function dwgModal(no){
  const d=D.drawings.find(x=>x.no===no); if(!d) return;
  openModal(`<div class="mh"><div><span class="tag">${d.no}</span><h2>${d.ti}</h2></div><button class="x" type="button" data-close aria-label="Close">×</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${pill(d.st)}<span class="pill">Rev ${d.rev}</span><span class="pill">${d.d}</span></div>
    <div style="aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:4px;background:
      linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px,var(--surface-2);
      display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">Drawing preview</div>
    <div><h3>Revision history</h3><ul style="margin:6px 0 0;padding-left:18px">${d.hist.map(h=>`<li class="sub">${h}</li>`).join('')}</ul></div>
    <div><h3>Linked RFIs</h3><p class="sub" style="margin:4px 0 0">${d.rfi.length?d.rfi.join(', '):'None'}</p></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" type="button" data-toast="Mark-up mode (demo)">Mark up</button><button class="btn pri" type="button" data-toast="RFI draft created from ${d.no} (demo)">Raise RFI</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-dwgopen],[data-projopen],[data-subopen],[data-scrim]'); if(!t) return;
  if(t.dataset.subopen){ subModal(t.dataset.subopen); return; }
  if(t.id==='syncBtn'){
    S.online=!S.online;
    if(S.online){const n=S.queue; S.queue=0; render(); toast(n?`Signal back. ${n} item${n>1?'s':''} sent.`:'Signal back. Everything is up to date.');}
    else {render(); toast('Signal lost (simulated). The app keeps working offline.');}
    return;
  }
  if(t.dataset.projopen){ selectProject(t.dataset.projopen); return; }
  if(t.matches('[data-scrim]') && e.target!==t) return;
  if(t.dataset.scrim!==undefined || t.dataset.close!==undefined){closeLayer();return;}
  if(t.dataset.go){ S.view=t.dataset.go; if(t.dataset.tab2){const [k,v]=t.dataset.tab2.split(':'); S[k]=v;} closeLayer(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.tab){ const [k,v]=t.dataset.tab.split(':'); S[k]=v; render(); return; }
  if(t.dataset.dwg){ S.dwgFilter=t.dataset.dwg; render(); return; }
  if(t.dataset.dwgopen){ dwgModal(t.dataset.dwgopen); return; }
  if(t.dataset.report!==undefined || t.id==='reportBtn'){ reportModal(); return; }
  if(t.dataset.toolbox!==undefined){ S.toolbox=true; if(!S.online) S.queue++; render(); toast(S.online?'Attendance recorded for today\'s toolbox talk':'Attendance saved on this phone. Will send when signal returns.'); return; }
  if(t.dataset.checkin!==undefined){ S.checkedIn=true; if(!S.online) S.queue++; render(); toast(S.online?'Checked in at 07:02 (demo)':'Check-in saved offline at 07:02 (demo)'); return; }
  if(t.dataset.approveMr){ D.mr[+t.dataset.approveMr].st='Approved'; if(!S.online) S.queue++; render(); toast(S.online?'Material request approved. Purchasing notified (demo)':'Approval saved offline. Will send when signal returns.'); return; }
  if(t.dataset.toast){ toast(t.dataset.toast); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeLayer();
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.dwgopen) dwgModal(e.target.dataset.dwgopen);
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.projopen) selectProject(e.target.dataset.projopen);
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.subopen) subModal(e.target.dataset.subopen);
});
document.addEventListener('input', e=>{
  if(e.target.id!=='glossQ') return;
  const q=e.target.value.trim().toLowerCase(); let shown=0;
  document.querySelectorAll('#glossBody tr').forEach(r=>{const m=!q||r.dataset.gloss.includes(q); r.hidden=!m; if(m) shown++;});
  $('#glossNone').hidden=shown>0;
});
function selectProject(k){
  S.proj=k; render(); window.scrollTo(0,0);
  toast('Switched to '+P().n);
}
$('#proj').addEventListener('change', e=>selectProject(e.target.value));
document.addEventListener('submit', e=>{
  if(e.target.id!=='hzForm') return;
  e.preventDefault();
  const what=$('#hzWhat').value.trim(); if(!what){ $('#hzWhat').focus(); return; }
  const sev=(document.querySelector('input[name="sev"]:checked')||{}).value||'warn';
  const id='HZ-0'+(142+D.hazards.length-3);
  D.hazards.unshift({id,t:what,loc:$('#hzLoc').value,sev,by:'You',when:'Now',st:S.online?'Open':'Saved offline'});
  if(!S.online) S.queue++;
  closeLayer(); S.view='safety'; S.safetyTab='hazards'; render();
  toast(S.online?`${id} logged. It now shows in the safety officer's list (demo).`:`${id} saved on this phone. It will send when signal returns.`);
});
$('#role').addEventListener('change', e=>{
  S.role=e.target.value; S.view='home';
  try{localStorage.setItem('sitelink.role',S.role);}catch(err){}
  render(); toast('Now viewing as '+ROLE_NAME[S.role]);
});
window.addEventListener('resize', ()=>{const th=$('#top').offsetHeight; document.documentElement.style.setProperty('--toph',th+'px');});

render();
})();
</script>
