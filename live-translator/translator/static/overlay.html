<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption Overlay</title>
<style>
  /* Transparent page for OBS "Browser source" or a screen-shared window in the other room. */
  html, body { margin: 0; background: transparent; }
  body.solid { background: #000; }
  #cap { position: fixed; left: 4%; right: 4%; bottom: 6%; text-align: center;
    font: 600 clamp(22px, 4vw, 48px)/1.3 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #fff;
    text-shadow: 0 0 6px #000, 0 2px 4px #000; }
  #cap div { background: rgba(0,0,0,.55); display: inline-block; padding: 4px 14px; border-radius: 6px; margin: 3px 0; }
</style>
</head>
<body>
<div id="cap"></div>
<script>
"use strict";
// Add ?solid=1 for a black background (when screen-sharing instead of using OBS).
if (new URLSearchParams(location.search).get("solid")) document.body.className = "solid";
const cid = decodeURIComponent(location.pathname.split("/").pop());
const cap = document.getElementById("cap");
const lines = [];
let clearTimer;
function show(text) {
  lines.push(text); while (lines.length > 2) lines.shift();
  cap.innerHTML = "";
  lines.forEach((t) => { const d = document.createElement("div"); d.textContent = t; cap.appendChild(d); cap.appendChild(document.createElement("br")); });
  clearTimeout(clearTimer);
  clearTimer = setTimeout(() => { lines.length = 0; cap.innerHTML = ""; }, 12000);
}
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/room/${encodeURIComponent(cid)}`);
  let first = true;
  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") return;
    const m = JSON.parse(ev.data);
    if (m.type === "caption" && !(first && Date.now() / 1000 - m.ts > 15)) show(m.text);
  };
  ws.onopen = () => setTimeout(() => (first = false), 1000);
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
