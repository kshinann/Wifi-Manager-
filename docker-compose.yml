# AI Guard: backend API + management portal + PostgreSQL.
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
# Portal: http://localhost:8080 (put a TLS-terminating reverse proxy in front for production).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiguard
      POSTGRES_USER: aiguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiguard -d aiguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://aiguard:${POSTGRES_PASSWORD}@db:5432/aiguard
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}

  portal:
    build: ./portal
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${PORTAL_PORT:-8080}:80"

volumes:
  db-data:
