[project]
name = "aiguard-agent"
version = "0.1.0"
description = "AI Guard desktop agent: monitors AI tool usage and enforces policy"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.scripts]
aiguard-agent = "aiguard_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiguard_agent*"]
